services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: seiva
      POSTGRES_PASSWORD: seiva
      POSTGRES_DB: seiva
    ports: ["5432:5432"]
    volumes: ["seiva-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seiva"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://seiva:seiva@db:5432/seiva
      REDIS_URL: redis://redis:6379
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  seiva-db:
