services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: seiva
      POSTGRES_PASSWORD: seiva
      POSTGRES_DB: seiva
    ports: ["5432:5432"]
    volumes: ["seiva-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seiva"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://seiva:seiva@db:5432/seiva
      REDIS_URL: redis://redis:6379
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Perfil "audio": docker compose --profile audio up -d
  # Fica fora do up padrao porque os modelos sao pesados (~1-2 GB) e nem todo
  # ambiente de dev precisa de voz.
  stt:
    # API compativel com OpenAI (/v1/audio/transcriptions), que e o que
    # src/services/media/stt.ts fala.
    image: fedirz/faster-whisper-server:latest-cpu
    profiles: ["audio"]
    environment:
      WHISPER__MODEL: Systran/faster-whisper-small
      WHISPER__INFERENCE_DEVICE: cpu
    ports: ["9000:8000"]
    volumes: ["seiva-whisper:/root/.cache/huggingface"]

  tts:
    # API compativel com OpenAI (/v1/audio/speech), que e o que
    # src/services/media/tts.ts fala. Vozes pt-BR via Piper.
    image: ghcr.io/matatonic/openedai-speech-min:latest
    profiles: ["audio"]
    ports: ["5002:8000"]
    volumes: ["seiva-tts:/app/voices"]

volumes:
  seiva-db:
  seiva-whisper:
  seiva-tts:
